stages:
  - test
  - build
  - package
  - release

variables:
  # Dotnet
  DOTNET_SDK_IMAGE: "registry-gitlab.avion.team/voicecraft/voicecraft.build:latest"
  DOTNET_CLI_HOME: "$CI_PROJECT_DIR/.dotnet-home"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_UI_LANGUAGE: "en"
  # Android
  MS_OPENJDK_VERSION: "25.0.4.1"
  ANDROID_COMPILE_SDK: "36.1"
  ANDROID_BUILD_TOOLS: "36.1.0"
  # Nuget
  NUGET_CLI_LANGUAGE: "en"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  # Other
  GIT_CLEAN_FLAGS: "-ffdx -e .nuget/"
  MSBuildEnableWorkloadResolver: "false"
  
  # Options
  RUN_TESTS: "false"
  BUILD_LINUX_CLIENT: "false"
  BUILD_WINDOWS_CLIENT: "false"
  BUILD_MACOS_CLIENT: "false"
  BUILD_IOS_CLIENT: "false"
  BUILD_ANDROID_CLIENT: "true"
  BUILD_LINUX_SERVER: "false"
  BUILD_WINDOWS_SERVER: "false"
  
# SDK Install
.dotnet:
  image: "$DOTNET_SDK_IMAGE"

.dotnet:linux:
  extends: .dotnet
  cache:
    key:
      files:
        - Directory.Packages.props
      prefix: nuget-linux
    paths:
      - .nuget/packages/
    policy: pull
  before_script:
    - mkdir -p "$DOTNET_CLI_HOME" "$NUGET_PACKAGES"
    - dotnet --version

.dotnet:windows:
  extends: .dotnet
  before_script:
    - $env:DOTNET_CLI_HOME = Join-Path $env:CI_PROJECT_DIR ".dotnet-home"
    - $env:NUGET_PACKAGES = Join-Path $env:CI_PROJECT_DIR ".nuget\packages"
    - New-Item -ItemType Directory -Force -Path $env:DOTNET_CLI_HOME, $env:NUGET_PACKAGES | Out-Null
    - dotnet --version

.dotnet:macos:
  variables:
    MSBuildEnableWorkloadResolver: "true"
  before_script:
    - export PATH="/usr/local/share/dotnet:/opt/homebrew/bin:/usr/local/bin:$PATH"
    - mkdir -p "$DOTNET_CLI_HOME" "$NUGET_PACKAGES"
    - dotnet --version
  
# Tests
.test:
  rules:
    - if: $RUN_TESTS == "true"
  stage: test
  script:
    - dotnet test ./VoiceCraft.Tests/VoiceCraft.Tests.csproj -c Release -p:UseSharedCompilation=false --collect:"XPlat Code Coverage" --logger "junit;LogFileName=junit.xml" --results-directory TestResults
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - TestResults/
    reports:
      junit: TestResults/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: TestResults/**/coverage.cobertura.xml

test:linux:
  rules:
    - if: $RUN_TESTS == "true"
  extends:
    - .dotnet:linux
    - .test
  stage: test
  tags:
    - ubuntu-docker
  cache:
    key:
      files:
        - Directory.Packages.props
      prefix: nuget-linux
    paths:
      - .nuget/packages/
    policy: pull-push

test:windows:
  rules:
    - if: $RUN_TESTS == "true"
  extends:
    - .dotnet:windows
    - .test
  stage: test
  tags:
    - windows-shell

test:macos:
  extends:
    - .dotnet:macos
    - .test
  tags:
    - macos-shell

# Build Client
build:client:linux:
  rules:
    - if: $BUILD_LINUX_CLIENT == "true"
  extends: .dotnet:linux
  stage: build
  tags:
    - ubuntu-docker
  parallel: 
    matrix:
      - ARCH: [x64, arm, arm64]
  script: 
    - cd ./VoiceCraft.Client/VoiceCraft.Client.Linux
    - dotnet restore -r linux-$ARCH
    - dotnet publish -c Release -r linux-$ARCH -p:PublishSingleFile=true -p:UseSharedCompilation=false -o "$CI_PROJECT_DIR/VoiceCraft.Client.Linux.$ARCH"
  artifacts:
    name: "VoiceCraft.Client.Linux.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Client.Linux.$ARCH/
    
build:client:windows:
  rules:
    - if: $BUILD_WINDOWS_CLIENT == "true"
  extends: .dotnet:windows
  stage: build
  tags:
    - windows-shell
  parallel:
    matrix:
      - ARCH: [x64, x86, arm64]
  script:
    - cd ./VoiceCraft.Client/VoiceCraft.Client.Windows
    - dotnet restore -r "win-$env:ARCH"
    - dotnet publish -c Release -r "win-$env:ARCH" -p:PublishSingleFile=true -p:UseSharedCompilation=false -o "$env:CI_PROJECT_DIR\VoiceCraft.Client.Windows.$env:ARCH"
    - $uri = "https://aka.ms/vc14/vc_redist.$env:ARCH.exe"
    - $outFile = Join-Path $env:CI_PROJECT_DIR "VoiceCraft.Client.Windows.$env:ARCH\vc_redist.$env:ARCH.exe"
    - Invoke-WebRequest -Uri $uri -OutFile $outFile
  artifacts:
    name: "VoiceCraft.Client.Windows.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Client.Windows.$ARCH/
    exclude:
      - VoiceCraft.Client.Windows.$ARCH/*.pdb

build:client:macos:
  rules:
    - if: $BUILD_MACOS_CLIENT == "true"
  extends: .dotnet:macos
  stage: build
  tags:
    - macos-shell
  parallel:
    matrix:
      - ARCH: [x64, arm64]
  script:
    - cd ./VoiceCraft.Client/VoiceCraft.Client.MacOS
    - xcodebuild -version
    - dotnet restore -r "osx-$ARCH"
    - dotnet publish -c Release -r "osx-$ARCH" --no-restore -p:UseSharedCompilation=false
    - |
      output_dir="$PWD/bin/Release/net10.0-macos/osx-$ARCH"
      app_bundle=$(find "$output_dir" -maxdepth 2 -name '*.app' -print -quit)
      if [ -z "$app_bundle" ]; then
        echo "No macOS app bundle found in $output_dir"
        exit 1
      fi
      artifact_dir="$CI_PROJECT_DIR/VoiceCraft.Client.MacOS.$ARCH"
      mkdir -p "$artifact_dir"
      hdiutil create -volname VoiceCraft -srcfolder "$app_bundle" -ov -format UDZO "$artifact_dir/VoiceCraft.Client.MacOS.$ARCH.dmg"
      pkgbuild --component "$app_bundle" --install-location /Applications "$artifact_dir/VoiceCraft.Client.MacOS.$ARCH.pkg"
  artifacts:
    name: "VoiceCraft.Client.MacOS.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Client.MacOS.$ARCH/
    
build:client:android:
  rules:
    - if: $BUILD_ANDROID_CLIENT == "true"
  extends: .dotnet:linux
  stage: build
  tags:
    - ubuntu-docker
  parallel:
    matrix:
      - ARCH: [ arm64 ]
  before_script:
    - apt-get --quiet update --yes
    - apt-get --quiet install --yes wget zip unzip
    - curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
    - android update
    - android sdk install platforms/android-${ANDROID_COMPILE_SDK} build-tools/${ANDROID_BUILD_TOOLS}
  script:
    - dir

build:client:ios:
  rules:
    - if: $BUILD_IOS_CLIENT == "true"
  extends: .dotnet:macos
  stage: build
  tags:
    - macos-shell
  script:
    - cd ./VoiceCraft.Client/VoiceCraft.Client.iOS
    - xcodebuild -version
    - dotnet publish -c Release -r ios-arm64 -p:BuildIpa=true -p:EnableCodeSigning=false -p:UseSharedCompilation=false
    - mkdir -p "$CI_PROJECT_DIR/VoiceCraft.Client.iOS.arm64"
    - cp ./bin/Release/net10.0-ios/ios-arm64/publish/*.ipa "$CI_PROJECT_DIR/VoiceCraft.Client.iOS.arm64/"
  artifacts:
    name: "VoiceCraft.Client.iOS.arm64"
    expire_in: 14 days
    paths:
      - VoiceCraft.Client.iOS.arm64/

# Build Server
build:server:linux:
  rules:
    - if: $BUILD_LINUX_SERVER == "true"
  extends: .dotnet:linux
  stage: build
  tags:
    - ubuntu-docker
  parallel:
    matrix:
      - ARCH: [x64, arm, arm64]
  script:
    - cd ./VoiceCraft.Server
    - dotnet restore -r linux-$ARCH
    - dotnet publish -c Release -r linux-$ARCH -p:PublishSingleFile=true -p:UseSharedCompilation=false -o "$CI_PROJECT_DIR/VoiceCraft.Server.Linux.$ARCH"
  artifacts:
    name: "VoiceCraft.Server.Linux.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Server.Linux.$ARCH/
    
build:server:windows:
  rules:
    - if: $BUILD_LINUX_SERVER == "true"
  extends: .dotnet:windows
  stage: build
  tags:
    - windows-shell
  parallel:
    matrix:
      - ARCH: [x64, x86, arm64]
  script:
    - cd ./VoiceCraft.Server
    - dotnet restore -r "win-$env:ARCH"
    - dotnet publish -c Release -r "win-$env:ARCH" -p:PublishSingleFile=true -p:UseSharedCompilation=false -o "$env:CI_PROJECT_DIR\VoiceCraft.Server.Windows.$env:ARCH"
  artifacts:
    name: "VoiceCraft.Server.Windows.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Server.Windows.$ARCH/
    exclude:
      - VoiceCraft.Server.Windows.$ARCH/*.pdb