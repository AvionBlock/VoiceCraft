stages:
  - test
  - build
  - package
  - release

variables:
  # Dotnet
  DOTNET_SDK_IMAGE: "registry-gitlab.avion.team/voicecraft/voicecraft.build:latest"
  DOTNET_CLI_HOME: "$CI_PROJECT_DIR/.dotnet-home"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_UI_LANGUAGE: "en"
  # Android
  MS_OPENJDK: "21.0.12.1"
  ANDROID_CLI_TOOLS: "15859902"
  ANDROID_COMPILE_SDK: "36.1"
  ANDROID_BUILD_TOOLS: "36.1.0"
  # Nuget
  NUGET_CLI_LANGUAGE: "en"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  # Other
  GIT_CLEAN_FLAGS: "-ffdx -e .nuget/"
  MSBuildEnableWorkloadResolver: "false"
  
  # Options
  RUN_TESTS: "false"
  BUILD_LINUX_CLIENT: "true"
  BUILD_WINDOWS_CLIENT: "true"
  BUILD_MACOS_CLIENT: "true"
  BUILD_IOS_CLIENT: "true"
  BUILD_ANDROID_CLIENT: "true"
  BUILD_LINUX_SERVER: "true"
  BUILD_WINDOWS_SERVER: "true"
  
  # Manual Options
  RELEASE_ENABLED:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Set to true in a manual pipeline to package artifacts and create a GitLab release."
  RELEASE_VERSION:
    value: "1.7.2"
    description: "Release version without the leading v. Example: 1.7.2"
  RELEASE_CHANNEL:
    value: "beta"
    options:
      - "stable"
      - "beta"
      - "alpha"
      - "nightly"
    description: "Release channel. Stable uses tag v<version>; non-stable uses v<version>-<channel>.<pipeline_id>."
  RELEASE_NOTES:
    value: ""
    description: "Optional extra release notes appended to the generated GitLab release description."
  
# SDK Install
.dotnet:
  image: "$DOTNET_SDK_IMAGE"

.dotnet:linux:
  extends: .dotnet
  cache:
    key:
      files:
        - Directory.Packages.props
      prefix: nuget-linux
    paths:
      - .nuget/packages/
    policy: pull
  before_script:
    - mkdir -p "$DOTNET_CLI_HOME" "$NUGET_PACKAGES"
    - dotnet --version

.dotnet:windows:
  extends: .dotnet
  before_script:
    - $env:DOTNET_CLI_HOME = Join-Path $env:CI_PROJECT_DIR ".dotnet-home"
    - $env:NUGET_PACKAGES = Join-Path $env:CI_PROJECT_DIR ".nuget\packages"
    - New-Item -ItemType Directory -Force -Path $env:DOTNET_CLI_HOME, $env:NUGET_PACKAGES | Out-Null
    - dotnet --version

.dotnet:macos:
  variables:
    MSBuildEnableWorkloadResolver: "true"
  before_script:
    - export PATH="/usr/local/share/dotnet:/opt/homebrew/bin:/usr/local/bin:$PATH"
    - mkdir -p "$DOTNET_CLI_HOME" "$NUGET_PACKAGES"
    - dotnet --version
  
# Tests
.test:
  rules:
    - if: $RUN_TESTS == "true"
  stage: test
  script:
    - dotnet test ./VoiceCraft.Tests/VoiceCraft.Tests.csproj -c Release -p:UseSharedCompilation=false --collect:"XPlat Code Coverage" --logger "junit;LogFileName=junit.xml" --results-directory TestResults
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - TestResults/
    reports:
      junit: TestResults/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: TestResults/**/coverage.cobertura.xml

test:linux:
  rules:
    - if: $RUN_TESTS == "true"
  extends:
    - .dotnet:linux
    - .test
  stage: test
  tags:
    - ubuntu-docker
  cache:
    key:
      files:
        - Directory.Packages.props
      prefix: nuget-linux
    paths:
      - .nuget/packages/
    policy: pull-push

test:windows:
  rules:
    - if: $RUN_TESTS == "true"
  extends:
    - .dotnet:windows
    - .test
  stage: test
  tags:
    - windows-shell

test:macos:
  extends:
    - .dotnet:macos
    - .test
  tags:
    - macos-shell

# Build Client
build:client:linux:
  rules:
    - if: $BUILD_LINUX_CLIENT == "true"
  extends: .dotnet:linux
  stage: build
  tags:
    - ubuntu-docker
  parallel: 
    matrix:
      - ARCH: [x64, arm, arm64]
  script: 
    - cd ./VoiceCraft.Client/VoiceCraft.Client.Linux
    - dotnet restore -r linux-$ARCH
    - dotnet publish -c Release -r "linux-$ARCH" -o "$CI_PROJECT_DIR/VoiceCraft.Client.Linux.$ARCH"
  artifacts:
    name: "VoiceCraft.Client.Linux.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Client.Linux.$ARCH/
    
build:client:windows:
  rules:
    - if: $BUILD_WINDOWS_CLIENT == "true"
  extends: .dotnet:windows
  stage: build
  tags:
    - windows-shell
  parallel:
    matrix:
      - ARCH: [x64, x86, arm64]
  script:
    - cd ./VoiceCraft.Client/VoiceCraft.Client.Windows
    - dotnet restore -r "win-$env:ARCH"
    - dotnet publish -c Release -r "win-$env:ARCH" -o "$env:CI_PROJECT_DIR\VoiceCraft.Client.Windows.$env:ARCH"
    - $uri = "https://aka.ms/vc14/vc_redist.$env:ARCH.exe"
    - $outFile = Join-Path $env:CI_PROJECT_DIR "VoiceCraft.Client.Windows.$env:ARCH\vc_redist.$env:ARCH.exe"
    - Invoke-WebRequest -Uri $uri -OutFile $outFile
  artifacts:
    name: "VoiceCraft.Client.Windows.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Client.Windows.$ARCH/
    exclude:
      - VoiceCraft.Client.Windows.$ARCH/*.pdb

build:client:macos:
  rules:
    - if: $BUILD_MACOS_CLIENT == "true"
  extends: .dotnet:macos
  stage: build
  tags:
    - macos-shell
  parallel:
    matrix:
      - ARCH: [x64, arm64]
  script:
    - cd ./VoiceCraft.Client/VoiceCraft.Client.MacOS
    - xcodebuild -version
    - dotnet restore -r "osx-$ARCH"
    - dotnet publish -c Release -r "osx-$ARCH" --no-restore
    - |
      output_dir="$PWD/bin/Release/net10.0-macos/osx-$ARCH"
      app_bundle=$(find "$output_dir" -maxdepth 2 -name '*.app' -print -quit)
      if [ -z "$app_bundle" ]; then
        echo "No macOS app bundle found in $output_dir"
        exit 1
      fi
      artifact_dir="$CI_PROJECT_DIR/VoiceCraft.Client.MacOS.$ARCH"
      mkdir -p "$artifact_dir"
      hdiutil create -volname VoiceCraft -srcfolder "$app_bundle" -ov -format UDZO "$artifact_dir/VoiceCraft.Client.MacOS.$ARCH.dmg"
      pkgbuild --component "$app_bundle" --install-location /Applications "$artifact_dir/VoiceCraft.Client.MacOS.$ARCH.pkg"
  artifacts:
    name: "VoiceCraft.Client.MacOS.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Client.MacOS.$ARCH/
    
build:client:android:
  variables:
    MSBuildEnableWorkloadResolver: "true"
  rules:
    - if: $BUILD_ANDROID_CLIENT == "true"
  extends: .dotnet:linux
  stage: build
  tags:
    - ubuntu-docker
  parallel:
    matrix:
      - ARCH: [ arm64 ]
  before_script: 
    - apt-get --quiet update --yes
    - apt-get --quiet install --yes wget zip unzip
    - |
      wget -q -P ./android-sdk/cmdline-tools https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CLI_TOOLS}_latest.zip
      unzip -d ./android-sdk/cmdline-tools ./android-sdk/cmdline-tools/commandlinetools-linux-${ANDROID_CLI_TOOLS}_latest.zip
      rm ./android-sdk/cmdline-tools/*.zip
      mv ./android-sdk/cmdline-tools/cmdline-tools ./android-sdk/cmdline-tools/latest
      echo y | ./android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}"
    - |
      wget -q -P ./jdk https://aka.ms/download-jdk/microsoft-jdk-${MS_OPENJDK}-linux-x64.tar.gz
      tar -xvzf ./jdk/microsoft-jdk-${MS_OPENJDK}-linux-x64.tar.gz -C ./jdk
      rm ./jdk/*.tar.gz
      
    - export ANDROID_HOME=${CI_PROJECT_DIR}/android-sdk
    - export JAVA_HOME=${CI_PROJECT_DIR}/jdk/`dir ./jdk | tail -1`
  script:
    - cd ./VoiceCraft.Client/VoiceCraft.Client.Android
    - dotnet workload restore
    - |
      if [ -n "${ANDROID_KEYSTORE:-}" ] && [ "${CI_PIPELINE_SOURCE:-}" != "merge_request_event" ]; then
        if [ -z "${ALIAS:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
          echo "Android signing requires ALIAS and KEYSTORE_PASSWORD." >&2
          exit 1
        fi

        keystore="$(mktemp)"
        trap 'rm -f "$keystore"' EXIT
        printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$keystore"

        dotnet publish -c Release -r "android-$ARCH" -o "$CI_PROJECT_DIR/VoiceCraft.Client.Android.$ARCH" \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore="$keystore" \
          -p:AndroidSigningKeyAlias="$ALIAS" \
          -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD \
          -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
      else
        echo "Android signing skipped: no keystore or merge request pipeline."
        dotnet publish -c Release -r "android-$ARCH" -o "$CI_PROJECT_DIR/VoiceCraft.Client.Android.$ARCH"
      fi
  artifacts:
    name: "VoiceCraft.Client.Android.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Client.Android.$ARCH/*.apk

build:client:ios:
  rules:
    - if: $BUILD_IOS_CLIENT == "true"
  extends: .dotnet:macos
  stage: build
  tags:
    - macos-shell
  script:
    - cd ./VoiceCraft.Client/VoiceCraft.Client.iOS
    - xcodebuild -version
    - dotnet publish -c Release -r ios-arm64 -p:BuildIpa=true -p:EnableCodeSigning=false
    - mkdir -p "$CI_PROJECT_DIR/VoiceCraft.Client.iOS.arm64"
    - cp ./bin/Release/net10.0-ios/ios-arm64/publish/*.ipa "$CI_PROJECT_DIR/VoiceCraft.Client.iOS.arm64/"
  artifacts:
    name: "VoiceCraft.Client.iOS.arm64"
    expire_in: 14 days
    paths:
      - VoiceCraft.Client.iOS.arm64/

# Build Server
build:server:linux:
  rules:
    - if: $BUILD_LINUX_SERVER == "true"
  extends: .dotnet:linux
  stage: build
  tags:
    - ubuntu-docker
  parallel:
    matrix:
      - ARCH: [x64, arm, arm64]
  script:
    - cd ./VoiceCraft.Server
    - dotnet restore -r linux-$ARCH
    - dotnet publish -c Release -r linux-$ARCH -o "$CI_PROJECT_DIR/VoiceCraft.Server.Linux.$ARCH"
  artifacts:
    name: "VoiceCraft.Server.Linux.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Server.Linux.$ARCH/
    
build:server:windows:
  rules:
    - if: $BUILD_LINUX_SERVER == "true"
  extends: .dotnet:windows
  stage: build
  tags:
    - windows-shell
  parallel:
    matrix:
      - ARCH: [x64, x86, arm64]
  script:
    - cd ./VoiceCraft.Server
    - dotnet restore -r "win-$env:ARCH"
    - dotnet publish -c Release -r "win-$env:ARCH" -o "$env:CI_PROJECT_DIR\VoiceCraft.Server.Windows.$env:ARCH"
  artifacts:
    name: "VoiceCraft.Server.Windows.$ARCH"
    expire_in: 14 days
    paths:
      - VoiceCraft.Server.Windows.$ARCH/
    exclude:
      - VoiceCraft.Server.Windows.$ARCH/*.pdb

release:gitlab:
  stage: package
  tags:
    - ubuntu-docker
  rules:
    - if: '$RELEASE_ENABLED == "true"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - |
      release_version="${RELEASE_VERSION:-}"
      release_channel="${RELEASE_CHANNEL:-beta}"
      
      if [ -z "$release_version" ]; then
        echo "RELEASE_VERSION must be set."
        exit 1
      fi
      
      if ! printf '%s' "$release_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
        echo "RELEASE_VERSION must look like 1.7.0 or 1.7.0-rc.1, without a leading v."
        exit 1
      fi
      
      if [[ $release_channel != @(stable|beta|alpha|nightly) ]]; then
          echo "RELEASE_CHANNEL must be one of: stable, beta, alpha, nightly."
          exit 1
      fi
      
      if [ "$release_channel" = "stable" ]; then
        release_tag="v$release_version"
        release_name="VoiceCraft $release_version"
      else
        release_tag="v$release_version-$release_channel.$CI_PIPELINE_IID"
        release_name="VoiceCraft $release_version $release_channel"
      fi
    - |
      package_name="voicecraft"
      : > release_assets.env
      : > release_assets.md
      
      asset = 0
      artifacts = "VoiceCraft.Client.Windows.*|VoiceCraft.Client.Linux.*|VoiceCraft.Client.Android.*|VoiceCraft.Client.iOS.*|VoiceCraft.Client.MacOS.*|VoiceCraft.Server.Windows.*|VoiceCraft.Server.Linux.*"
      for artifact in $artifacts
      do
        if [ ! -d "$artifact" ]; then
          echo "Missing artifact directory: $artifact"
          exit 1
        fi
      
        ((asset++))
        package_file="$artifact.$release_tag.zip"
        package_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$package_name/$release_tag/$package_file"
        artifact_filepath="/voicecraft/$release_tag/$package_file"
        zip -r "$package_file" "$artifact"
      
        curl --fail --show-error --silent --request PUT --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$package_file" "$package_url"
        {
          printf 'RELEASE_ASSET_%s_NAME=%s\n' "$asset_index" "$package_file"
          printf 'RELEASE_ASSET_%s_URL=%s\n' "$asset_index" "$package_url"
          printf 'RELEASE_ASSET_%s_FILEPATH=%s\n' "$asset_index" "$artifact_filepath"
        } >> release_assets.env

        printf '%s\n' "- [$package_file]($package_url)" >> release_assets.md
      done
      
      {
        printf 'RELEASE_TAG=%s\n' "$release_tag"
        printf 'RELEASE_ASSET_COUNT=%s\n' "$asset_index"
        printf 'PACKAGE_JOB_ID=%s\n' "$CI_JOB_ID"
      } > release.env
      
      {
        printf '# %s\n\n' "$release_name"
        printf '- Version: `%s`\n' "$release_version"
        printf '- Channel: `%s`\n' "$release_channel"
        printf '- Commit: `%s`\n' "$CI_COMMIT_SHA"
        printf '- Pipeline: `%s`\n\n' "$CI_PIPELINE_URL"
        printf '## Artifacts\n\n'
        cat release_assets.md
        if [ -n "${RELEASE_NOTES:-}" ]; then
          printf '\n## Notes\n\n%s\n' "$RELEASE_NOTES"
        fi
      } > release_notes.md
  artifacts:
    name: "VoiceCraft.Artifacts.$CI_COMMIT_REF_SLUG.$CI_PIPELINE_IID"
    expire_in: 30 days
    reports:
      dotenv: release.env
    paths:
      - release.env
      - release_assets.env
      - release_notes.md